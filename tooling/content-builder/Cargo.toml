[package]
name = "curated-content-builder"
version = "0.2.0"
edition = "2021"
description = "Curated content builder CLI — upload depot builds (Windows-first)"
publish = false

[[bin]]
name = "curated-content-builder"
path = "src/main.rs"

[lib]
name = "curated_content_builder"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
uuid = { version = "1", features = ["serde"] }
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
