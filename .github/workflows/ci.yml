name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test SDK
        run: dotnet test Curated.Sdk.sln --configuration Release

  engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test RPG Maker plugin against the launch contract fixtures
        run: node --test engines/rpgmaker/CuratedSDK.test.mjs
      - name: Check game language tables in every binding
        run: python3 scripts/check-game-languages.py
      - name: Pack engine bindings
        run: |
          bash scripts/pack-unity-zip.sh "${RUNNER_TEMP}/sdk-unity"
          bash scripts/pack-engines.sh "${RUNNER_TEMP}/sdk-unity/publish/Curated.Sdk.dll" "${RUNNER_TEMP}/engines"

  content-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
      - name: Test CLI
        working-directory: tooling/content-builder
        run: cargo test
      - name: Build CLI
        working-directory: tooling/content-builder
        run: cargo build --release

  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test changelog release helper
        working-directory: scripts
        run: python3 -m unittest test_release_changelog.py -v
