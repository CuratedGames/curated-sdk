name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test SDK
        run: dotnet test Curated.Sdk.sln --configuration Release

  engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test RPG Maker plugin against the launch contract fixtures
        run: node --test engines/rpgmaker/CuratedSDK.test.mjs
      - name: Check game language tables in every binding
        run: python3 scripts/check-game-languages.py
      - name: Check public API manifest matches every binding
        run: python3 scripts/check-public-api.py
      - name: Pack engine bindings
        run: |
          bash scripts/pack-unity-zip.sh "${RUNNER_TEMP}/sdk-unity"
          bash scripts/pack-engines.sh "${RUNNER_TEMP}/sdk-unity/publish/Curated.Sdk.dll" "${RUNNER_TEMP}/engines"

  content-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
      - name: Test CLI
        working-directory: tooling/content-builder
        run: cargo test
      - name: Build CLI
        working-directory: tooling/content-builder
        run: cargo build --release

  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test changelog release helper
        working-directory: scripts
        run: python3 -m unittest test_release_changelog.py test_engine_changelogs.py -v
      - name: Check engine package changelogs are in sync
        run: python3 scripts/engine_changelogs.py --check

  # docs.curated.games: builds on every PR (VitePress fails on dead links) and checks for
  # hardcoded SDK versions. The "docs updated with API changes" check is docs-required.yml.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Public API manifest matches every binding
        run: python3 scripts/check-public-api.py
      - name: No hardcoded SDK versions in docs
        run: python3 scripts/check-docs-versions.py
      - name: Snippet imports point at existing files and regions
        run: python3 scripts/check-docs-snippets.py
      - name: Install
        working-directory: docs
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Print resolved lockfile (one-off, to commit it)
        working-directory: docs
        run: echo "LOCKFILE_B64_BEGIN"; gzip -c package-lock.json | base64 -w0; echo; echo "LOCKFILE_B64_END"
      - name: Build (generates reference pages, fails on dead links)
        working-directory: docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build
      - name: Built site has versions filled in and every snippet
        run: python3 scripts/check-docs-snippets.py --dist docs/.vitepress/dist
