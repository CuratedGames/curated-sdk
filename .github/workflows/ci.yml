name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test SDK
        run: dotnet test Curated.Sdk.sln --configuration Release

  content-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
      - name: Test CLI
        working-directory: tooling/content-builder
        run: cargo test
      - name: Build CLI
        working-directory: tooling/content-builder
        run: cargo build --release
