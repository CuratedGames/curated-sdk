# Release workflow for this repository (SDK + Content Builder artifacts)
name: Release Curated.Sdk

on:
  push:
    branches: [main]
    paths:
      - "Curated.Sdk/**"
      - "Curated.Sdk.Tests/**"
      - "tooling/content-builder/**"
      - "scripts/**"
      - "contracts/**"
      - "engines/**"
      - "Curated.Sdk.sln"
      - "LICENSE.md"
      - "README.md"
      - "Agents.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sdk:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test
        run: |
          dotnet test Curated.Sdk.sln --configuration Release
          node --test engines/rpgmaker/CuratedSDK.test.mjs
          python3 scripts/check-game-languages.py
      - name: Pack assets
        id: pack
        run: |
          VERSION="$(grep -oP '(?<=<Version>)[^<]+' Curated.Sdk/Curated.Sdk.csproj | head -1)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          mkdir -p "${RUNNER_TEMP}/sdk-release"
          dotnet pack Curated.Sdk/Curated.Sdk.csproj --configuration Release \
            -o "${RUNNER_TEMP}/sdk-release"
          bash scripts/pack-unity-zip.sh "${RUNNER_TEMP}/sdk-unity"
          cp "${RUNNER_TEMP}/sdk-release/Curated.Sdk.${VERSION}.nupkg" \
            "${RUNNER_TEMP}/sdk-release/Curated.Sdk.nupkg"
          cp "${RUNNER_TEMP}/sdk-unity/Curated.Sdk.${VERSION}.unity.zip" \
            "${RUNNER_TEMP}/sdk-release/"
          cp "${RUNNER_TEMP}/sdk-unity/Curated.Sdk.unity.zip" \
            "${RUNNER_TEMP}/sdk-release/"
          cp "${RUNNER_TEMP}/sdk-unity/publish/Curated.Sdk.dll" \
            "${RUNNER_TEMP}/sdk-release/Curated.Sdk.dll"
          bash scripts/pack-engines.sh "${RUNNER_TEMP}/sdk-unity/publish/Curated.Sdk.dll" \
            "${RUNNER_TEMP}/sdk-release"
          cp contracts/launch-contract.md contracts/fixtures/conformance.v1.json \
            contracts/fixtures/game-language.v1.json \
            "${RUNNER_TEMP}/sdk-release/"
      - name: Upload SDK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdk-release
          path: ${{ runner.temp }}/sdk-release/*

  cli-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
      - name: Test CLI
        working-directory: tooling/content-builder
        run: cargo test
      - name: Build Linux release
        working-directory: tooling/content-builder
        run: |
          cargo build --release
          mkdir -p "${RUNNER_TEMP}/cli-linux"
          cp target/release/curated-content-builder \
            "${RUNNER_TEMP}/cli-linux/curated-content-builder-linux-x64"
      - name: Upload CLI Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-linux
          path: ${{ runner.temp }}/cli-linux/*

  cli-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
      - name: Build Windows release
        working-directory: tooling/content-builder
        run: |
          cargo build --release
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/cli-windows" | Out-Null
          Copy-Item target/release/curated-content-builder.exe `
            "$env:RUNNER_TEMP/cli-windows/curated-content-builder-windows-x64.exe"
      - name: Upload CLI Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-windows
          path: ${{ runner.temp }}/cli-windows/*

  release:
    needs: [sdk, cli-linux, cli-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download SDK artifacts
        uses: actions/download-artifact@v4
        with:
          name: sdk-release
          path: release-assets
      - name: Download CLI Linux
        uses: actions/download-artifact@v4
        with:
          name: cli-linux
          path: release-assets
      - name: Download CLI Windows
        uses: actions/download-artifact@v4
        with:
          name: cli-windows
          path: release-assets
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.sdk.outputs.version }}
          name: Curated.Sdk ${{ needs.sdk.outputs.version }}
          body: |
            **Curated.Sdk** ${{ needs.sdk.outputs.version }}: launch contract v1, engine bindings, `.nupkg`, and Content Builder CLI.

            Download assets from this Release page (not nuget.org).

            - Unity (recommended): `"com.curatedgames.sdk": "https://github.com/CuratedGames/curated-sdk.git?path=/engines/unity/com.curatedgames.sdk#v${{ needs.sdk.outputs.version }}"` in Packages/manifest.json.
            - Unity (optional tarball): `com.curatedgames.sdk-${{ needs.sdk.outputs.version }}.tgz` via Add package from tarball.
            - Godot 4: unzip `curated-godot-${{ needs.sdk.outputs.version }}.zip` into the project root and enable the plugin.
            - Unreal Engine 5: unzip `curated-unreal-${{ needs.sdk.outputs.version }}.zip` into the project's `Plugins/` folder.
            - RPG Maker MZ/MV: copy `CuratedSDK.js` into `js/plugins/`.
            - .NET: add a local NuGet source for `Curated.Sdk.${{ needs.sdk.outputs.version }}.nupkg`, or reference `Curated.Sdk.dll`.
            - Other engines: implement `launch-contract.md` and check it against `conformance.v1.json`.
            - CLI: `curated-content-builder-windows-x64.exe` (login, list-depots, upload). See Agents.md.

            License: see LICENSE.md (Curated SDK License). Source-available, not open source.
          files: |
            release-assets/Curated.Sdk.${{ needs.sdk.outputs.version }}.nupkg
            release-assets/Curated.Sdk.${{ needs.sdk.outputs.version }}.snupkg
            release-assets/Curated.Sdk.nupkg
            release-assets/Curated.Sdk.${{ needs.sdk.outputs.version }}.unity.zip
            release-assets/Curated.Sdk.unity.zip
            release-assets/Curated.Sdk.dll
            release-assets/com.curatedgames.sdk-${{ needs.sdk.outputs.version }}.tgz
            release-assets/curated-godot-${{ needs.sdk.outputs.version }}.zip
            release-assets/curated-unreal-${{ needs.sdk.outputs.version }}.zip
            release-assets/CuratedSDK.js
            release-assets/launch-contract.md
            release-assets/conformance.v1.json
            release-assets/game-language.v1.json
            release-assets/curated-content-builder-linux-x64
            release-assets/curated-content-builder-windows-x64.exe
          fail_on_unmatched_files: true
          make_latest: true
